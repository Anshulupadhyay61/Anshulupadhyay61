name: Generate Premium GitHub Contribution Snake

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Generate premium contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#39FF88&color_dots=#111827,#064E3B,#047857,#10B981,#39FF88

      - name: Commit snake animation
        uses: EndBug/add-and-commit@v9
        with:
          add: profile/snake.svg
          message: "✨ Update premium contribution snake"
