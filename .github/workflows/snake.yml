name: 🐍 Premium GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout repository
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Generate premium snake animation
      - name: 🐍 Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Anshulupadhyay61
          outputs: |
            profile/github-snake.svg?palette=github-dark&color_snake=#00ff88&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Commit generated animation
      - name: 💾 Commit Snake Animation
        uses: EndBug/add-and-commit@v9
        with:
          add: "profile/github-snake.svg"
          message: "🐍 Update GitHub contribution snake"
          default_author: github_actions
